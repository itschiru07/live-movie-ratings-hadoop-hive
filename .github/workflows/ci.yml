name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run MapReduce Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Syntax Check All Python Scripts
      run: |
        python -m py_compile mapper.py reducer.py producer.py mongo_to_hdfs.py stats_to_mongo.py dashboard.py
